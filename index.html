<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>وصلة | المساعد الإداري  
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  

</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand-mark">و</div>
      <h1>وصلة</h1>
      <p class="muted">المساعد الإداري الذكي</p>
      <form id="loginForm" class="stack">
        <label>اسم المستخدم
          <input id="username" autocomplete="username" required placeholder="admin" />
        </label>
        <label>كلمة المرور
          <input id="password" type="password" autocomplete="current-password" required placeholder="1234" />
        </label>
        <button type="submit" class="primary">تسجيل الدخول</button>
      </form>
      <p class="hint">للتجربة: <b>admin</b> / <b>1234</b></p>
      <p class="warning">نسخة تجريبية تعمل داخل المتصفح فقط. لا تستخدمي بيانات حقيقية أو حساسة عند نشرها بشكل عام.</p>
    </div>
  </section>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small">و</span><div><b>وصلة</b><small>المساعد الإداري الذكي</small></div></div>
      <nav id="nav">
        <button data-page="dashboard" class="active">لوحة التحكم</button>
        <button data-page="staff">بيانات الكادر</button>
        <button data-page="parents">أولياء الأمور</button>
        <button data-page="requests">الطلبات والمراسلات</button>
        <button data-page="platforms">المنصات</button>
        <button data-page="reports">التقارير</button>
        <button data-page="settings">الإعدادات</button>
      </nav>
      <button id="logoutBtn" class="ghost logout">تسجيل الخروج</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">لوحة التحكم</h2>
          <p id="pageSubtitle" class="muted">نظرة سريعة على العمل الإداري</p>
        </div>
        <button id="menuBtn" class="menu-btn">☰</button>
      </header>

      <section id="dashboard" class="page active-page">
        <div class="cards">
          <article class="card stat"><span>الكادر</span><strong id="staffCount">0</strong></article>
          <article class="card stat"><span>أولياء الأمور</span><strong id="parentsCount">0</strong></article>
          <article class="card stat"><span>الطلبات المفتوحة</span><strong id="openRequestsCount">0</strong></article>
        </div>
        <div class="grid2">
          <article class="card">
            <h3>إجراءات سريعة</h3>
            <div class="actions">
              <button class="primary quick" data-go="staff">استيراد بيانات الكادر</button>
              <button class="secondary quick" data-go="parents">استيراد أولياء الأمور</button>
              <button class="secondary quick" data-go="requests">إضافة طلب</button>
            </div>
          </article>
          <article class="card">
            <h3>ملاحظات اليوم</h3>
            <textarea id="dailyNotes" rows="7" placeholder="اكتبي ملاحظاتك هنا..."></textarea>
            <button id="saveNotes" class="primary">حفظ الملاحظات</button>
          </article>
        </div>
      </section>

      <section id="staff" class="page">
        <div class="card">
          <div class="section-head"><div><h3>بيانات الكادر</h3><p class="muted">استيراد CSV أو Excel ثم حفظه محليًا على الجهاز.</p></div><button id="addStaffBtn" class="primary">+ إضافة</button></div>
          <div class="import-row">
            <input id="staffFile" type="file" accept=".csv,.xlsx,.xls" />
            <button class="secondary" data-template="staff">تحميل نموذج CSV</button>
            <button id="saveStaffBtn" class="primary">حفظ البيانات</button>
          </div>
          <div class="table-wrap"><table><thead><tr><th>الاسم</th><th>المسمى</th><th>الجوال</th><th>البريد</th><th></th></tr></thead><tbody id="staffBody"></tbody></table></div>
        </div>
      </section>

      <section id="parents" class="page">
        <div class="card">
          <div class="section-head"><div><h3>أولياء الأمور</h3><p class="muted">يمكن الاستيراد من CSV أو Excel.</p></div><button id="addParentBtn" class="primary">+ إضافة</button></div>
          <div class="import-row">
            <input id="parentsFile" type="file" accept=".csv,.xlsx,.xls" />
            <button class="secondary" data-template="parents">تحميل نموذج CSV</button>
            <button id="saveParentsBtn" class="primary">حفظ البيانات</button>
          </div>
          <div class="table-wrap"><table><thead><tr><th>ولي الأمر</th><th>الطالبة</th><th>الصف</th><th>الجوال</th><th></th></tr></thead><tbody id="parentsBody"></tbody></table></div>
        </div>
      </section>

      <section id="requests" class="page">
        <div class="card">
          <div class="section-head"><div><h3>الطلبات والمراسلات</h3><p class="muted">متابعة الطلبات وحالتها.</p></div><button id="addRequestBtn" class="primary">+ طلب جديد</button></div>
          <div class="table-wrap"><table><thead><tr><th>العنوان</th><th>الجهة</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody id="requestsBody"></tbody></table></div>
        </div>
      </section>

      <section id="platforms" class="page">
        <div class="cards platforms">
          <a class="card platform" href="https://noor.moe.gov.sa/" target="_blank" rel="noopener"><strong>نظام نور</strong><span>فتح المنصة</span></a>
          <a class="card platform" href="https://schools.madrasati.sa/" target="_blank" rel="noopener"><strong>منصة مدرستي</strong><span>فتح المنصة</span></a>
          <a class="card platform" href="https://nvg.gov.sa/" target="_blank" rel="noopener"><strong>العمل التطوعي</strong><span>فتح المنصة</span></a>
        </div>
      </section>

      <section id="reports" class="page">
        <div class="card">
          <h3>التقارير</h3>
          <p class="muted">تصدير نسخة احتياطية من البيانات المخزنة داخل المتصفح.</p>
          <div class="actions"><button id="exportJson" class="primary">تصدير نسخة JSON</button><button id="clearData" class="danger">مسح البيانات المحلية</button></div>
        </div>
      </section>

      <section id="settings" class="page">
        <div class="card"><h3>الإعدادات</h3><p>هذه النسخة تعمل بدون خادم وباستخدام التخزين المحلي للمتصفح فقط.</p><p class="warning">للاستخدام المدرسي الحقيقي نحتاج لاحقًا قاعدة بيانات آمنة، حسابات مستخدمين وصلاحيات، واتصالًا مشفرًا بالخدمات المصرح بها.</p></div>
      </section>
    </main>
  </div>

  <dialog id="entryDialog">
    <form method="dialog" id="entryForm" class="dialog-card">
      <h3 id="dialogTitle">إضافة</h3>
      <div id="dialogFields" class="stack"></div>
      <div class="dialog-actions"><button value="cancel" class="ghost">إلغاء</button><button id="dialogSave" value="default" class="primary">حفظ</button></div>
    </form>
  </dialog>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
